<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RotationOCR — Upload</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        background: #f5f6fa;
        color: #1a1a2e;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ── Header ── */
      header {
        background: #1a1a2e;
        color: #fff;
        padding: 0 28px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }
      .brand {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .brand span { color: #4f8ef7; }
      .header-nav {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .nav-link {
        color: rgba(255,255,255,0.82);
        text-decoration: none;
        font-size: 14px;
        padding: 7px 12px;
        border-radius: 8px;
        transition: background 0.15s;
      }
      .nav-link:hover { background: rgba(255,255,255,0.10); }
      .btn-logout {
        background: rgba(255,255,255,0.10);
        border: 1px solid rgba(255,255,255,0.18);
        color: #fff;
        font-size: 14px;
        padding: 7px 14px;
        border-radius: 8px;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.15s;
      }
      .btn-logout:hover { background: rgba(255,255,255,0.18); }

      /* ── Main ── */
      main {
        flex: 1;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 48px 16px 64px;
      }
      .upload-card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(26,26,46,0.10);
        padding: 36px 40px;
        width: 100%;
        max-width: 680px;
      }
      .upload-card h1 {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 6px;
        color: #1a1a2e;
      }
      .upload-card .subtitle {
        font-size: 14px;
        color: #6b7280;
        margin-bottom: 28px;
      }

      /* ── Drop zone ── */
      .dropzone {
        border: 2px dashed #c7d2fe;
        border-radius: 12px;
        background: #f8f9ff;
        min-height: 300px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
        padding: 32px;
        text-align: center;
      }
      .dropzone.dragover {
        border-color: #4f8ef7;
        background: #eff6ff;
        border-style: solid;
      }
      .dropzone svg { color: #a5b4fc; }
      .dropzone .dz-text {
        font-size: 16px;
        font-weight: 500;
        color: #374151;
      }
      .dropzone .dz-sub {
        font-size: 13px;
        color: #9ca3af;
      }

      /* ── Boutons sélection ── */
      .select-btns {
        display: flex;
        gap: 12px;
        margin-top: 16px;
      }
      .btn-select {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 11px 16px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background: #fff;
        font-size: 14px;
        font-weight: 500;
        color: #374151;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
      }
      .btn-select:hover { border-color: #a5b4fc; background: #f5f3ff; }

      /* ── Liste fichiers sélectionnés ── */
      .file-summary {
        margin-top: 20px;
        display: none;
      }
      .file-summary.visible { display: block; }
      .file-summary-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .file-count {
        font-size: 14px;
        font-weight: 600;
        color: #1a1a2e;
      }
      .file-size-total {
        font-size: 13px;
        color: #6b7280;
        margin-left: 8px;
      }
      .btn-clear {
        background: none;
        border: none;
        font-size: 13px;
        color: #ef4444;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 6px;
        transition: background 0.15s;
      }
      .btn-clear:hover { background: #fef2f2; }
      .file-list-scroll {
        max-height: 200px;
        overflow-y: auto;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: #fafafa;
      }
      .file-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid #f3f4f6;
        font-size: 13px;
        gap: 8px;
      }
      .file-item:last-child { border-bottom: none; }
      .file-item-name {
        color: #374151;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
        min-width: 0;
      }
      .file-item-size { color: #9ca3af; white-space: nowrap; flex-shrink: 0; }

      /* ── Bouton lancer ── */
      .launch-wrap {
        margin-top: 24px;
        text-align: center;
      }
      .btn-launch {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 14px 40px;
        background: #16213e;
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s, transform 0.1s;
        box-shadow: 0 4px 14px rgba(22,33,62,0.25);
      }
      .btn-launch:hover:not(:disabled) { background: #0f3460; transform: translateY(-1px); }
      .btn-launch:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

      /* ── Progression ── */
      .progress-section {
        margin-top: 28px;
        display: none;
      }
      .progress-section.visible { display: block; }
      .progress-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 600;
        color: #1a1a2e;
      }
      .progress-track {
        height: 8px;
        background: #e5e7eb;
        border-radius: 99px;
        overflow: hidden;
        margin-bottom: 16px;
      }
      .progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #4f8ef7, #0f3460);
        border-radius: 99px;
        width: 0%;
        transition: width 0.3s ease;
      }
      .processing-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 260px;
        overflow-y: auto;
      }
      .processing-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-radius: 8px;
        background: #f9fafb;
        font-size: 13px;
        border: 1px solid #f3f4f6;
      }
      .processing-item .pi-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #374151;
      }
      .pi-status {
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .pi-status.pending   { color: #9ca3af; }
      .pi-status.processing { color: #f59e0b; }
      .pi-status.done      { color: #16a34a; }
      .pi-status.error     { color: #dc2626; }

      /* Spinner CSS */
      .spinner {
        width: 14px; height: 14px;
        border: 2px solid #e5e7eb;
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        flex-shrink: 0;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      .status-msg {
        margin-top: 12px;
        font-size: 14px;
        text-align: center;
        min-height: 20px;
      }
      .status-msg.ok    { color: #16a34a; }
      .status-msg.warn  { color: #f59e0b; }
      .status-msg.error { color: #dc2626; }

      /* ── Hidden ── */
      input[type="file"] { display: none; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">Rotation<span>OCR</span></div>
      <nav class="header-nav">
        <a class="nav-link" href="/exports">📋 Historique des lots</a>
        <a class="btn-logout" href="/logout">Déconnexion</a>
      </nav>
    </header>

    <main>
      <div class="upload-card">
        <h1>Correction de rotation PDF</h1>
        <p class="subtitle">Déposez vos fichiers, l'IA corrige l'orientation et renomme chaque document.</p>

        <!-- Zone drop -->
        <div id="dropzone" class="dropzone">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 16 12 12 8 16"></polyline>
            <line x1="12" y1="12" x2="12" y2="21"></line>
            <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path>
          </svg>
          <div class="dz-text">Glissez vos fichiers ou dossiers ici</div>
          <div class="dz-sub">Formats acceptés : PDF uniquement</div>
        </div>

        <!-- Boutons sélection -->
        <div class="select-btns">
          <button class="btn-select" id="btnFolder" type="button">📁 Sélectionner un dossier</button>
          <button class="btn-select" id="btnFiles" type="button">📄 Sélectionner des fichiers</button>
        </div>
        <input id="inputFolder" type="file" webkitdirectory directory multiple accept=".pdf,application/pdf" />
        <input id="inputFiles"  type="file" multiple accept=".pdf,application/pdf" />

        <!-- Liste fichiers -->
        <div id="fileSummary" class="file-summary">
          <div class="file-summary-header">
            <div>
              <span class="file-count" id="fileCount">0 fichier(s)</span>
              <span class="file-size-total" id="fileSizeTotal"></span>
            </div>
            <button class="btn-clear" id="btnClear" type="button">✕ Vider la sélection</button>
          </div>
          <div class="file-list-scroll">
            <ul id="fileList"></ul>
          </div>
        </div>

        <!-- Bouton lancer -->
        <div class="launch-wrap">
          <button class="btn-launch" id="btnLaunch" type="button" disabled>
            🚀 Lancer le traitement
          </button>
        </div>

        <!-- Section progression -->
        <div id="progressSection" class="progress-section">
          <div class="progress-header">
            <span>Traitement en cours…</span>
            <span id="progressText">0%</span>
          </div>
          <div class="progress-track">
            <div class="progress-bar" id="progressBar"></div>
          </div>
          <ul class="processing-list" id="processingList"></ul>
          <div class="status-msg" id="statusMsg"></div>
        </div>
      </div>
    </main>

    <script>
      // ── State ──
      let selectedItems = [];   // { key, file, relativePath }
      let currentJobId  = null;
      let pollTimer     = null;

      // ── DOM refs ──
      const dropzone        = document.getElementById("dropzone");
      const inputFolder     = document.getElementById("inputFolder");
      const inputFiles      = document.getElementById("inputFiles");
      const btnFolder       = document.getElementById("btnFolder");
      const btnFiles        = document.getElementById("btnFiles");
      const btnClear        = document.getElementById("btnClear");
      const btnLaunch       = document.getElementById("btnLaunch");
      const fileSummary     = document.getElementById("fileSummary");
      const fileCount       = document.getElementById("fileCount");
      const fileSizeTotal   = document.getElementById("fileSizeTotal");
      const fileList        = document.getElementById("fileList");
      const progressSection = document.getElementById("progressSection");
      const progressBar     = document.getElementById("progressBar");
      const progressText    = document.getElementById("progressText");
      const processingList  = document.getElementById("processingList");
      const statusMsg       = document.getElementById("statusMsg");

      // ── Helpers ──
      function formatBytes(bytes) {
        if (bytes < 1024) return bytes + " o";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " Ko";
        return (bytes / (1024 * 1024)).toFixed(1) + " Mo";
      }

      function sanitizePath(p) {
        return (p || "").replace(/\\/g, "/").replace(/^\/+/, "");
      }

      function isPdf(file) {
        return (file.name || "").toLowerCase().endsWith(".pdf");
      }

      function addFiles(fileList) {
        for (const file of fileList) {
          if (!isPdf(file)) continue;
          const relativePath = sanitizePath(file.webkitRelativePath || file.name);
          if (!relativePath) continue;
          const key = `${relativePath}::${file.size}`;
          if (!selectedItems.some(i => i.key === key)) {
            selectedItems.push({ key, file, relativePath });
          }
        }
        refreshUI();
      }

      async function walkEntry(entry, base = "") {
        if (entry.isFile) {
          await new Promise(resolve => entry.file(file => {
            if (isPdf(file)) {
              const rel = sanitizePath(`${base}${file.name}`);
              const key = `${rel}::${file.size}`;
              if (!selectedItems.some(i => i.key === key)) {
                selectedItems.push({ key, file, relativePath: rel });
              }
            }
            resolve();
          }));
        } else if (entry.isDirectory) {
          const reader = entry.createReader();
          const entries = await new Promise(r => reader.readEntries(r));
          for (const child of entries) await walkEntry(child, `${base}${entry.name}/`);
        }
      }

      function refreshUI() {
        const hasFiles = selectedItems.length > 0;
        btnLaunch.disabled = !hasFiles;

        if (!hasFiles) {
          fileSummary.classList.remove("visible");
          return;
        }

        fileSummary.classList.add("visible");
        const totalSize = selectedItems.reduce((s, i) => s + i.file.size, 0);
        fileCount.textContent = `${selectedItems.length} fichier(s)`;
        fileSizeTotal.textContent = `· ${formatBytes(totalSize)}`;

        fileList.innerHTML = "";
        [...selectedItems]
          .sort((a, b) => a.relativePath.localeCompare(b.relativePath))
          .forEach(({ file, relativePath }) => {
            const li = document.createElement("li");
            li.className = "file-item";
            li.innerHTML = `
              <span class="file-item-name" title="${esc(relativePath)}">${esc(relativePath)}</span>
              <span class="file-item-size">${formatBytes(file.size)}</span>
            `;
            fileList.appendChild(li);
          });
      }

      function clearSelection() {
        selectedItems = [];
        inputFolder.value = "";
        inputFiles.value = "";
        refreshUI();
      }

      function esc(s) {
        return String(s)
          .replace(/&/g,"&amp;").replace(/</g,"&lt;")
          .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
      }

      // ── Drag & drop ──
      ["dragenter","dragover"].forEach(ev =>
        dropzone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); dropzone.classList.add("dragover"); })
      );
      ["dragleave","drop"].forEach(ev =>
        dropzone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); dropzone.classList.remove("dragover"); })
      );
      dropzone.addEventListener("drop", async e => {
        if (e.dataTransfer?.items?.length) {
          const entries = [];
          for (const item of e.dataTransfer.items) {
            const entry = item.webkitGetAsEntry?.();
            if (entry) entries.push(entry);
          }
          if (entries.length) {
            for (const entry of entries) await walkEntry(entry, "");
            refreshUI();
            return;
          }
        }
        if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
      });
      dropzone.addEventListener("click", () => inputFiles.click());

      // ── Boutons sélection ──
      btnFolder.addEventListener("click", () => inputFolder.click());
      btnFiles.addEventListener("click",  () => inputFiles.click());
      inputFolder.addEventListener("change", () => addFiles(inputFolder.files));
      inputFiles.addEventListener("change",  () => addFiles(inputFiles.files));
      btnClear.addEventListener("click", clearSelection);

      // ── Upload & polling ──
      async function startProcessing() {
        if (!selectedItems.length) return;

        btnLaunch.disabled = true;
        fileSummary.classList.remove("visible");
        progressSection.classList.add("visible");
        setStatusMsg("Envoi des fichiers…", "warn");

        const formData = new FormData();
        for (const item of selectedItems) {
          formData.append("files", item.file, item.file.name);
          formData.append("relative_paths", item.relativePath);
        }

        try {
          const res  = await fetch("/upload", { method: "POST", body: formData });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Échec de l'upload");

          currentJobId = data.job_id;
          setStatusMsg("Traitement en cours…", "warn");
          await pollStatus();
          pollTimer = setInterval(pollStatus, 2000);
        } catch (err) {
          setStatusMsg(err.message, "error");
          btnLaunch.disabled = false;
        }
      }

      async function pollStatus() {
        if (!currentJobId) return;
        try {
          const res  = await fetch(`/status/${encodeURIComponent(currentJobId)}`);
          if (!res.ok) throw new Error("Erreur statut");
          const data = await res.json();
          renderProgress(data);
        } catch (err) {
          setStatusMsg(err.message, "error");
        }
      }

      function renderProgress(data) {
        const pct = data.global_progress ?? 0;
        progressBar.style.width = `${pct}%`;
        progressText.textContent = `${pct}% (${data.done}/${data.total})`;

        processingList.innerHTML = "";
        for (const f of data.files || []) {
          const li = document.createElement("li");
          li.className = "processing-item";

          let iconHtml = "";
          let piClass  = "pending";
          if (f.status === "processing") { iconHtml = '<div class="spinner"></div>'; piClass = "processing"; }
          else if (f.status === "done")  { iconHtml = "✅"; piClass = "done"; }
          else if (f.status === "error") { iconHtml = "❌"; piClass = "error"; }
          else                           { iconHtml = "⏳"; piClass = "pending"; }

          li.innerHTML = `
            ${iconHtml}
            <span class="pi-name" title="${esc(f.relative_path)}">${esc(f.original_name || f.relative_path)}</span>
            <span class="pi-status ${piClass}">${f.progress}%</span>
          `;
          processingList.appendChild(li);
        }

        const jobStatus  = data.job_status || "";
        const allDone    = data.done >= data.total && data.total > 0;
        const jobClosed  = jobStatus === "finished" || jobStatus === "error";

        if (allDone && !jobClosed) {
          setStatusMsg("Finalisation de l'export…", "warn");
        }

        if (allDone && jobClosed) {
          clearInterval(pollTimer);
          pollTimer = null;

          if (data.redirect_url) {
            setStatusMsg("Traitement terminé. Redirection…", "ok");
            setTimeout(() => { window.location.href = data.redirect_url; }, 800);
          } else {
            setStatusMsg("Traitement terminé.", "ok");
          }
        }
      }

      function setStatusMsg(text, cls = "") {
        statusMsg.textContent = text;
        statusMsg.className = `status-msg ${cls}`.trim();
      }

      btnLaunch.addEventListener("click", startProcessing);
    </script>
  </body>
</html>
