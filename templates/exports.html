<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RotationOCR — Historique</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        background: #f5f6fa;
        color: #1a1a2e;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ── Header ── */
      header {
        background: #1a1a2e;
        color: #fff;
        padding: 0 28px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-shrink: 0;
      }
      .brand {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .brand span { color: #4f8ef7; }
      .header-nav {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .nav-link {
        color: rgba(255,255,255,0.82);
        text-decoration: none;
        font-size: 14px;
        padding: 7px 12px;
        border-radius: 8px;
        transition: background 0.15s;
        white-space: nowrap;
      }
      .nav-link:hover { background: rgba(255,255,255,0.10); }
      .btn-logout {
        background: rgba(255,255,255,0.10);
        border: 1px solid rgba(255,255,255,0.18);
        color: #fff;
        font-size: 14px;
        padding: 7px 14px;
        border-radius: 8px;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.15s;
      }
      .btn-logout:hover { background: rgba(255,255,255,0.18); }

      /* ── Main ── */
      main {
        flex: 1;
        padding: 40px 24px 64px;
        max-width: 900px;
        margin: 0 auto;
        width: 100%;
      }
      .page-title {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 24px;
        color: #1a1a2e;
      }

      /* ── Spinner ── */
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 80px;
        color: #9ca3af;
        font-size: 15px;
        gap: 12px;
      }
      .spinner {
        width: 20px; height: 20px;
        border: 3px solid #e5e7eb;
        border-top-color: #4f8ef7;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ── Empty state ── */
      .empty-state {
        text-align: center;
        padding: 80px 24px;
        display: none;
      }
      .empty-state.visible { display: block; }
      .empty-icon { font-size: 48px; margin-bottom: 16px; }
      .empty-text { font-size: 16px; color: #6b7280; margin-bottom: 20px; }
      .btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        background: #16213e;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.15s;
      }
      .btn-primary:hover { background: #0f3460; }

      /* ── Cards liste ── */
      .cards-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
        display: none;
      }
      .cards-list.visible { display: flex; }

      /* ── Card lot ── */
      .lot-card {
        background: #fff;
        border-radius: 14px;
        border: 1.5px solid #e5e7eb;
        padding: 20px 24px;
        box-shadow: 0 2px 10px rgba(26,26,46,0.06);
        transition: box-shadow 0.15s;
      }
      .lot-card:hover { box-shadow: 0 4px 18px rgba(26,26,46,0.10); }
      .lot-card.deleted {
        opacity: 0.52;
        background: #f9fafb;
        pointer-events: none;
      }
      /* réactiver les éléments visuels mais pas les boutons */
      .lot-card.deleted .lot-header,
      .lot-card.deleted .lot-counts,
      .lot-card.deleted .lot-status { pointer-events: none; }

      .lot-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .lot-date {
        font-size: 16px;
        font-weight: 700;
        color: #1a1a2e;
      }

      /* Badge statut */
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 20px;
        white-space: nowrap;
      }
      .status-badge.available { background: #dcfce7; color: #15803d; }
      .status-badge.countdown { background: #fef3c7; color: #b45309; }
      .status-badge.deleted   { background: #f3f4f6; color: #6b7280; }

      .lot-counts {
        font-size: 14px;
        color: #374151;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .count-sep { color: #d1d5db; }
      .count-ok   { color: #16a34a; font-weight: 600; }
      .count-warn { color: #d97706; font-weight: 600; }
      .count-err  { font-size: 12px; color: #ef4444; }

      .lot-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .btn-results {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 9px 16px;
        border-radius: 9px;
        border: 1.5px solid #e5e7eb;
        background: #fff;
        font-size: 13px;
        font-weight: 500;
        color: #374151;
        cursor: pointer;
        text-decoration: none;
        transition: border-color 0.15s, background 0.15s;
      }
      .btn-results:hover { border-color: #a5b4fc; background: #f5f3ff; }
      .btn-results:disabled,
      .btn-results[disabled] {
        opacity: 0.4;
        cursor: not-allowed;
        pointer-events: none;
      }
      .btn-zip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 9px 16px;
        border-radius: 9px;
        background: #16213e;
        color: #fff;
        border: none;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.15s;
        box-shadow: 0 2px 8px rgba(22,33,62,0.18);
      }
      .btn-zip:hover { background: #0f3460; }
      .btn-zip:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">Rotation<span>OCR</span></div>
      <nav class="header-nav">
        <a class="nav-link" href="/">← Nouvelle upload</a>
        <a class="btn-logout" href="/logout">Déconnexion</a>
      </nav>
    </header>

    <main>
      <h1 class="page-title">Historique des lots traités</h1>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        Chargement…
      </div>

      <div class="empty-state" id="emptyState">
        <div class="empty-icon">📭</div>
        <div class="empty-text">Aucun lot traité pour l'instant.</div>
        <a class="btn-primary" href="/">🚀 Lancer un traitement</a>
      </div>

      <div class="cards-list" id="cardsList"></div>
    </main>

    <script>
      const DOWNLOAD_TTL = 3600; // secondes, doit correspondre à job_store.DOWNLOAD_TTL_SECONDS

      const loadingEl   = document.getElementById("loading");
      const emptyState  = document.getElementById("emptyState");
      const cardsList   = document.getElementById("cardsList");

      // ── Utilitaires ──
      function fmtDate(ts) {
        return new Date(ts * 1000).toLocaleString("fr-FR", {
          day: "2-digit", month: "long", year: "numeric",
          hour: "2-digit", minute: "2-digit"
        });
      }

      function computeStatus(exp) {
        if (!exp.job_exists) return { type: "deleted", label: "🗑 Supprimé" };
        if (exp.downloaded_at == null) return { type: "available", label: "✅ Disponible" };
        const deleteAt  = exp.downloaded_at + DOWNLOAD_TTL;
        const remaining = deleteAt - (Date.now() / 1000);
        if (remaining <= 0) return { type: "deleted", label: "🗑 Supprimé" };
        return { type: "countdown", deleteAt, label: countdownLabel(remaining) };
      }

      function countdownLabel(remaining) {
        const mins = Math.ceil(remaining / 60);
        if (mins >= 60) {
          const hrs = Math.floor(mins / 60);
          const m   = mins % 60;
          return `⏱ Suppression dans ${hrs}h${m > 0 ? m + "min" : ""}`;
        }
        return `⏱ Suppression dans ${mins} min`;
      }

      function esc(s) {
        return String(s)
          .replace(/&/g,"&amp;").replace(/</g,"&lt;")
          .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
      }

      // ── Rendu d'une card ──
      function renderCard(exp) {
        const status = computeStatus(exp);
        const isDeleted = status.type === "deleted";

        const card = document.createElement("div");
        card.className = "lot-card" + (isDeleted ? " deleted" : "");
        card.dataset.jobId = exp.job_id || "";

        // Compteurs
        const total     = exp.pdf_count || 0;
        const okCnt     = exp.ok_count   || 0;
        const warnCnt   = exp.warn_count  || 0;
        const untagged  = total - okCnt - warnCnt;

        let countsHtml = `<span>${total} fichier${total > 1 ? "s" : ""}</span>`;
        if (okCnt > 0 || warnCnt > 0) {
          countsHtml += `<span class="count-sep">•</span>`;
          if (okCnt > 0)   countsHtml += `<span class="count-ok">✅ ${okCnt} OK</span>`;
          if (warnCnt > 0) countsHtml += `<span class="count-warn">⚠️ ${warnCnt} à vérifier</span>`;
        }
        if (exp.has_error_report) {
          countsHtml += `<span class="count-err">⚠ rapport d'erreurs</span>`;
        }

        // Badge statut
        const badgeCls = status.type === "available" ? "available"
                       : status.type === "countdown"  ? "countdown"
                       : "deleted";

        const badgeHtml = `<span class="status-badge ${badgeCls}" ${
          status.type === "countdown" ? `data-delete-at="${status.deleteAt}"` : ""
        }>${esc(status.label)}</span>`;

        // Boutons
        const canResults = !isDeleted && exp.job_id;
        const canZip     = !isDeleted && exp.job_id;

        const resultsHtml = `<a
          class="btn-results"
          href="${canResults ? `/results/${encodeURIComponent(exp.job_id)}` : "#"}"
          ${canResults ? "" : 'disabled aria-disabled="true"'}
        >🔍 Voir les résultats</a>`;

        const zipHtml = `<button
          class="btn-zip"
          type="button"
          data-job-id="${esc(exp.job_id || "")}"
          ${canZip ? "" : "disabled"}
        >⬇️ Télécharger ZIP</button>`;

        card.innerHTML = `
          <div class="lot-header">
            <div class="lot-date">📁 Lot du ${esc(fmtDate(exp.created_at))}</div>
            ${badgeHtml}
          </div>
          <div class="lot-counts">${countsHtml}</div>
          <div class="lot-actions">
            ${resultsHtml}
            ${zipHtml}
          </div>
        `;

        // Listener bouton ZIP
        const zipBtn = card.querySelector(".btn-zip");
        if (zipBtn && canZip) {
          zipBtn.addEventListener("click", () => downloadLot(exp, card));
        }

        return card;
      }

      // ── Télécharger un lot ──
      async function downloadLot(exp, card) {
        try {
          await fetch(`/mark_downloaded/${encodeURIComponent(exp.job_id)}`, { method: "POST" });
        } catch (e) { /* non bloquant */ }

        // Mettre à jour le badge localement
        const now      = Date.now() / 1000;
        const deleteAt = now + DOWNLOAD_TTL;
        exp.downloaded_at = now;
        const badge = card.querySelector(".status-badge");
        if (badge) {
          badge.className = "status-badge countdown";
          badge.dataset.deleteAt = String(deleteAt);
          badge.textContent = countdownLabel(DOWNLOAD_TTL);
        }

        window.location.href = `/download_all/${encodeURIComponent(exp.job_id)}`;
      }

      // ── Chargement ──
      async function loadExports() {
        try {
          const res  = await fetch("/exports/api");
          if (!res.ok) throw new Error("Erreur chargement");
          const data = await res.json();
          const exports = data.exports || [];

          loadingEl.style.display = "none";

          if (!exports.length) {
            emptyState.classList.add("visible");
            return;
          }

          cardsList.classList.add("visible");
          exports.forEach(exp => cardsList.appendChild(renderCard(exp)));

          startCountdowns();
        } catch (err) {
          loadingEl.innerHTML = `<span style="color:#ef4444">Erreur : ${err.message}</span>`;
        }
      }

      // ── Mise à jour des countdowns ──
      function startCountdowns() {
        setInterval(() => {
          const badges = document.querySelectorAll(".status-badge.countdown[data-delete-at]");
          badges.forEach(badge => {
            const deleteAt  = parseFloat(badge.dataset.deleteAt);
            const remaining = deleteAt - (Date.now() / 1000);
            if (remaining <= 0) {
              badge.className    = "status-badge deleted";
              badge.textContent  = "🗑 Supprimé";
              const card = badge.closest(".lot-card");
              if (card) {
                card.classList.add("deleted");
                card.querySelectorAll(".btn-results, .btn-zip").forEach(b => b.setAttribute("disabled", ""));
              }
            } else {
              badge.textContent = countdownLabel(remaining);
            }
          });
        }, 30000); // toutes les 30 secondes
      }

      loadExports();
    </script>
  </body>
</html>
